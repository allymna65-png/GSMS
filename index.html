<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GSMS Team Hub & Workspace</title>
    <!-- Supabase JS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #0b141a;
            color: #e9edef;
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 20px;
        }
        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 16px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.2s;
            color: white;
        }
        button:hover { opacity: 0.85; }
        
        .btn-run { background-color: #00a884; }   /* WhatsApp Green */
        .btn-save { background-color: #3b82f6; }  /* Blue */
        .btn-edit { background-color: #f59e0b; }  /* Amber */
        .btn-clear { background-color: #64748b; } /* Slate */
        .btn-danger { background-color: #ef4444; }/* Red */

        .layout-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
        }
        @media (max-width: 900px) {
            .layout-grid { grid-template-columns: 1fr; }
        }

        .editor-section {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .box {
            background: #111b21;
            border-radius: 8px;
            padding: 15px;
            border: 1px solid #222d34;
        }
        h3 {
            color: #8696a0;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }
        textarea {
            width: 100%;
            height: 250px;
            background-color: #0b141a;
            color: #38bdf8;
            border: 1px solid #222d34;
            border-radius: 6px;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 14px;
            resize: vertical;
            outline: none;
        }
        iframe {
            width: 100%;
            height: 200px;
            background: white;
            border: none;
            border-radius: 6px;
        }

        /* WHATSAPP STYLE CHAT STYLES */
        .chat-container-box {
            display: flex;
            flex-direction: column;
            background: #0b141a;
            border-radius: 10px;
            border: 1px solid #222d34;
            height: 520px;
            overflow: hidden;
        }
        .chat-header {
            background: #202c33;
            padding: 12px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #222d34;
        }
        .chat-header h3 {
            margin: 0;
            color: #e9edef;
            font-size: 15px;
        }
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            background-color: #0b141a;
            /* Texture au muonekano wa background ya WhatsApp */
            background-image: radial-gradient(#202c33 1px, transparent 0);
            background-size: 16px 16px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        /* Bubble ya Ujumbe */
        .msg-bubble {
            max-width: 75%;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 14px;
            line-height: 1.4;
            position: relative;
            word-wrap: break-word;
            display: flex;
            flex-direction: column;
        }

        /* Ujumbe wako (Sent - Right side) */
        .msg-sent {
            align-self: flex-end;
            background-color: #005c4b;
            color: #e9edef;
            border-top-right-radius: 0;
        }

        /* Ujumbe wa Mtu mwingine (Received - Left side) */
        .msg-received {
            align-self: flex-start;
            background-color: #202c33;
            color: #e9edef;
            border-top-left-radius: 0;
        }

        .sender-title {
            font-size: 12px;
            font-weight: bold;
            color: #53bdeb;
            margin-bottom: 3px;
        }

        .msg-footer {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
            font-size: 10px;
            color: #8696a0;
            margin-top: 4px;
        }

        .tick-icon {
            color: #53bdeb; /* Green/Blue WhatsApp ticks */
            font-weight: bold;
        }

        .delete-btn-ws {
            background: transparent;
            border: none;
            color: #f87171;
            cursor: pointer;
            font-size: 12px;
            margin-left: 8px;
            opacity: 0.6;
        }
        .delete-btn-ws:hover { opacity: 1; }

        /* Chat Input Area */
        .chat-input-box {
            background: #202c33;
            padding: 10px;
            display: flex;
            gap: 8px;
            align-items: center;
        }
        .chat-input-box input {
            flex: 1;
            padding: 12px;
            background: #2a3942;
            border: none;
            color: #e9edef;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }
        .btn-send-ws {
            background-color: #00a884;
            border-radius: 50%;
            width: 42px;
            height: 42px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
        }

        .status-msg { margin-top: 5px; font-size: 12px; color: #a7f3d0; }

        /* NOTIFICATION TOAST STYLES */
        #toast-container {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast-msg {
            background: #202c33;
            color: white;
            border-left: 4px solid #00a884;
            padding: 12px 16px;
            border-radius: 8px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.5);
            min-width: 250px;
            max-width: 320px;
            animation: slideIn 0.3s ease-out forwards;
        }
        .toast-msg strong {
            color: #00a884;
            display: block;
            font-size: 13px;
        }
        .toast-msg p { font-size: 14px; margin-top: 2px; }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
    </style>
</head>
<body>

    <!-- Container ya Pop-up Notifications -->
    <div id="toast-container"></div>

    <div class="header">
        <h2>GSMS Team Hub & Workspace</h2>
    </div>

    <div class="layout-grid">
        <!-- LEFT: CODE EDITOR SECTION -->
        <div class="editor-section">
            <div class="box">
                <div class="toolbar">
                    <button class="btn-run" onclick="runCode()">▶ Run Code</button>
                    <button class="btn-save" onclick="saveCodeToSupabase()">💾 Save to Cloud</button>
                    <button class="btn-edit" onclick="loadCodeFromSupabase()">✏️ Edit / Load</button>
                    <button class="btn-clear" onclick="clearCode()">🗑️ Clear</button>
                </div>
                <h3>Editor (HTML / CSS / JS)</h3>
                <textarea id="codeEditor" placeholder="Andika kodi zako hapa..."></textarea>
                <div id="status" class="status-msg"></div>
            </div>

            <div class="box">
                <h3>Live Preview Output</h3>
                <iframe id="livePreview"></iframe>
            </div>
        </div>

        <!-- RIGHT: WHATSAPP STYLE CHAT SECTION -->
        <div class="chat-container-box">
            <div class="chat-header">
                <h3>💬 GSMS Team Chat</h3>
                <button class="btn-danger" style="font-size:11px; padding: 5px 8px;" onclick="deleteAllMessages()">
                    🧹 Clear All
                </button>
            </div>

            <div class="chat-messages" id="chatContainer">
                <!-- Messages zitaonyeshwa hapa kama WhatsApp bubbles -->
            </div>

            <div class="chat-input-box">
                <input type="text" id="messageInput" placeholder="Andika ujumbe..." onkeypress="handleKeyPress(event)">
                <button class="btn-send-ws" onclick="sendMessage()" title="Tuma">
                    ➤
                </button>
            </div>
        </div>
    </div>

    <script>
        // Config za Supabase
        const SUPABASE_URL = 'https://dxzsgsjzbwdtbluorkxx.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImR4enNnc2p6YndkdGJsdW9ya3h4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY2MzkwMjQsImV4cCI6MjEwMjIxNTAyNH0.ehJLFUA_M3Whyd7gBecn_yCXJHeqHuCNxRtRNxJYxI0';
        
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // Ruhusa ya Notification za Browser
        if ("Notification" in window && Notification.permission !== "granted") {
            Notification.requestPermission();
        }

        // --- EDITOR FUNCTIONS ---
        function runCode() {
            const code = document.getElementById('codeEditor').value;
            const preview = document.getElementById('livePreview').contentWindow.document;
            preview.open();
            preview.write(code);
            preview.close();
        }

        async function saveCodeToSupabase() {
            const codeContent = document.getElementById('codeEditor').value;
            const status = document.getElementById('status');
            if (!codeContent.trim()) return alert("Andika kodi kwanza!");

            status.innerText = "Inahifadhi...";
            const { error } = await _supabase.from('saved_codes').insert([{ code_content: codeContent }]);

            if (error) {
                alert("Kosa: " + error.message);
                status.innerText = "";
            } else {
                alert("Kodi imehifadhiwa vizuri Cloud! 🚀");
                status.innerText = "Imehifadhiwa!";
            }
        }

        async function loadCodeFromSupabase() {
            const { data, error } = await _supabase
                .from('saved_codes')
                .select('code_content')
                .order('updated_at', { ascending: false })
                .limit(1);

            if (data && data.length > 0) {
                document.getElementById('codeEditor').value = data[0].code_content;
                runCode();
                alert("Kodi iliyohifadhiwa imepakuliwa!");
            } else {
                alert("Hakuna kodi iliyohifadhiwa bado.");
            }
        }

        function clearCode() {
            if (confirm("Kusafisha editor?")) {
                document.getElementById('codeEditor').value = '';
                document.getElementById('livePreview').srcdoc = '';
            }
        }

        // --- WHATSAPP STYLE CHAT FUNCTIONS ---

        const MY_NAME = 'Admin'; // Jina lako kama mtumaji mkuu

        function formatTime(dateString) {
            const date = new Date(dateString);
            return date.toLocaleTimeString([], { hour: '2-2-digit', minute: '2-digit' });
        }

        function showPopUpToast(sender, message) {
            const toastContainer = document.getElementById('toast-container');
            const toast = document.createElement('div');
            toast.className = 'toast-msg';
            toast.innerHTML = `
                <strong>💬 ${sender}</strong>
                <p>${message}</p>
            `;
            
            toastContainer.appendChild(toast);

            setTimeout(() => { toast.remove(); }, 4000);
        }

        function sendBrowserNotification(sender, message) {
            if ("Notification" in window && Notification.permission === "granted") {
                new Notification(`💬 ${sender}`, {
                    body: message,
                    icon: 'https://cdn-icons-png.flaticon.com/512/732/732200.png'
                });
            }
        }

        // Vuta Ujumbe Wote na Upange kama WhatsApp
        async function loadMessages() {
            const { data, error } = await _supabase
                .from('messages')
                .select('*')
                .order('created_at', { ascending: true });

            if (error) return console.error(error);

            const container = document.getElementById('chatContainer');
            container.innerHTML = '';

            data.forEach(msg => {
                const isMe = (msg.sender_name === MY_NAME);
                const bubbleClass = isMe ? 'msg-sent' : 'msg-received';
                const timeStr = msg.created_at ? formatTime(msg.created_at) : '';
                const ticks = isMe ? '<span class="tick-icon">✓✓</span>' : '';

                container.innerHTML += `
                    <div class="msg-bubble ${bubbleClass}">
                        ${!isMe ? `<div class="sender-title">${msg.sender_name}</div>` : ''}
                        <div>${msg.message_text}</div>
                        <div class="msg-footer">
                            <span>${timeStr}</span>
                            ${ticks}
                            <button class="delete-btn-ws" onclick="deleteSingleMessage(${msg.id})" title="Futa">🗑️</button>
                        </div>
                    </div>
                `;
            });

            container.scrollTop = container.scrollHeight; // Scroll to bottom
        }

        // Tuma Ujumbe
        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if (!text) return;

            input.value = '';
            const { error } = await _supabase
                .from('messages')
                .insert([{ sender_name: MY_NAME, message_text: text }]);

            if (error) alert("Imeshindwa kutuma: " + error.message);
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }

        // FUTA SMS MOJA MOJA
        async function deleteSingleMessage(id) {
            if (confirm("Je, una uhakika unataka kufuta ujumbe huu?")) {
                const { error } = await _supabase.from('messages').delete().eq('id', id);
                if (error) alert("Kosa wakati wa kufuta: " + error.message);
                else loadMessages();
            }
        }

        // FUTA SMS ZOTE KWA PAMOJA
        async function deleteAllMessages() {
            const confirmation = prompt("ANDIKA 'FUTA' ILI KUTHIBITISHA KUFUTA CHAT ZOTE:");
            if (confirmation === 'FUTA') {
                const { error } = await _supabase.from('messages').delete().gt('id', 0);
                if (error) alert("Kosa wakati wa kufuta chat: " + error.message);
                else {
                    alert("Chat zote zimefutwa kikamilifu! 🧹");
                    loadMessages();
                }
            }
        }

        // Real-time Listener
        _supabase.channel('messages_realtime')
            .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'messages' }, (payload) => {
                const newMsg = payload.new;
                loadMessages();
                
                // Pop-up na Notification zinatokea kama siyo wewe umetuma
                if (newMsg.sender_name !== MY_NAME) {
                    showPopUpToast(newMsg.sender_name, newMsg.message_text);
                    sendBrowserNotification(newMsg.sender_name, newMsg.message_text);
                }
            })
            .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'messages' }, () => {
                loadMessages();
            })
            .subscribe();

        // Load chat unapoingia
        loadMessages();
    </script>
</body>
</html>
