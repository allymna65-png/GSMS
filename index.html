    <!-- 1. AUTHENTICATION & BOOTSTRAPPING SCREEN -->
    <div id="authScreen" class="flex items-center justify-center min-h-screen p-4">
        <div class="bg-slate-800 border border-slate-700 p-8 rounded-2xl w-full max-w-md shadow-2xl space-y-6">
            <div class="text-center">

            <!-- Login Form -->
            <form id="loginForm" onsubmit="handleLogin(event)" class="space-y-4">

                <button type="submit" id="loginBtn" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-medium py-2.5 rounded-lg text-sm transition shadow-lg shadow-blue-600/30">
                    Sign In
                </button>
            </form>

            <!-- Admin Bootstrapping Setup (Inaonekana mara ya kwanza tu ikiwa hakuna Admin) -->
            <div id="adminSetupBox" class="hidden pt-6 border-t border-slate-700">

                <form onsubmit="handleAdminSetup(event)" class="space-y-3">
                    <input type="text" id="adminName" placeholder="Jina Kamili la Admin" required class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-xs text-white">
                    <input type="email" id="adminEmail" placeholder="Email ya Admin" required class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-xs text-white">
                    <input type="password" id="adminPassword" placeholder="Password ya Admin" required class="w-full bg-slate-900 border border-slate-700 rounded px-3 py-2 text-xs text-white">
                    <button type="submit" id="adminBtn" class="w-full bg-amber-600 hover:bg-amber-500 text-white font-medium py-2 rounded text-xs transition">
                        Tengeneza Lead Admin
                    </button>
                </form>
            </div>
        </div>
    </div>

    <!-- 2. MAIN DASHBOARD PORTAL -->
    <div id="mainDashboard" class="hidden min-h-screen flex flex-col">
        <!-- Header -->
        <header class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex justify-between items-center sticky top-0 z-50">
            <div class="flex items-center gap-3">
                <i data-lucide="layout-dashboard" class="text-blue-400"></i>
                <div>
                    <h2 class="font-bold text-white text-base">GSMS Portal</h2>
                    <p class="text-xs text-slate-400" id="userBadgeRole">Loading...</p>
                </div>
            </div>
            <div class="flex items-center gap-4">
                <span id="userNameDisplay" class="text-xs font-semibold text-emerald-400 bg-emerald-950/50 border border-emerald-800 px-3 py-1 rounded-full"></span>
                <button onclick="logout()" class="text-xs text-slate-400 hover:text-rose-400 transition flex items-center gap-1">
                    <i data-lucide="log-out" class="w-4 h-4"></i> Logout
                </button>
            </div>
        </header>

        <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 space-y-8">

            <!-- ADMIN PANEL: MEMBER REGISTRATION -->
            <section id="adminPanel" class="hidden bg-slate-800 border border-blue-500/30 rounded-2xl p-6 shadow-xl">
                <div class="flex items-center gap-2 mb-4 text-blue-400">
                    <i data-lucide="user-plus"></i>
                    <h3 class="font-bold text-white text-lg">Msajili Mjumbe Mpya (Admin Panel)</h3>
                </div>
                <form onsubmit="handleMemberRegistration(event)" class="grid grid-cols-1 md:grid-cols-3 gap-4">
                    <input type="text" id="newFullName" required placeholder="Jina Kamili" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
                    <input type="email" id="newEmail" placeholder="Email (Si lazima)" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
                    <select id="newModule" class="bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
                        <option value="UI/UX & Tailwind Layouts">UI/UX & Tailwind Layouts</option>
                        <option value="JS Form Validation">JS Form Validation</option>
                        <option value="QA & System Testing">QA & System Testing</option>
                        <option value="Docs & Data Entry">Docs & Data Entry</option>
                        <option value="Backend Core Architecture">Backend Core Architecture</option>
                    </select>
                    <button type="submit" class="md:col-span-3 bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 rounded-lg text-sm transition">
                        Msajili Mjumbe (Random ID TCC_PRG_XXXX & Password 123456)
                    </button>
                </form>
            </section>

            <!-- SUBMIT WORK PROGRESS & MEDIA PROOF -->
            <section class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl">
                <div class="flex items-center gap-2 mb-4 text-emerald-400">
                    <i data-lucide="upload-cloud"></i>
                    <h3 class="font-bold text-white text-lg">Tuma Progress na Picha/Video Proof</h3>
                </div>
                <form onsubmit="handleWorkSubmission(event)" class="space-y-4">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Percentage (% Completeness)</label>
                            <input type="number" id="subProgress" min="0" max="100" required placeholder="0 - 100" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white">
                        </div>
                        <div>
                            <label class="block text-xs text-slate-400 mb-1">Upload Picha au Video Proof</label>
                            <input type="file" id="subMedia" accept="image/*,video/*" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-1.5 text-xs text-slate-300">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs text-slate-400 mb-1">Maelezo ya Kazi / Changamoto</label>
                        <textarea id="subNotes" rows="2" required placeholder="Eleza kazi uliyofanya leo..." class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white"></textarea>
                    </div>
                    <button type="submit" id="submitWorkBtn" class="bg-blue-600 hover:bg-blue-500 text-white font-medium px-6 py-2 rounded-lg text-sm transition">
                        Hifadhi Progress
                    </button>
                </form>
            </section>

            <!-- REAL-TIME TEAM FEED -->
            <section class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-4">
                <h3 class="font-bold text-white text-lg flex items-center gap-2">
                    <i data-lucide="activity" class="text-amber-400"></i> Real-time Team Feed
                </h3>
                <div id="submissionsList" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            </section>

            <!-- REAL-TIME CHAT -->
            <section class="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-xl space-y-4">
                <h3 class="font-bold text-white text-lg flex items-center gap-2">
                    <i data-lucide="message-square" class="text-cyan-400"></i> Live Team Inquiries & Chat
                </h3>
                <div id="chatBox" class="bg-slate-900 border border-slate-700 rounded-xl p-4 h-64 overflow-y-auto space-y-3"></div>
                <form onsubmit="handleSendChat(event)" class="flex gap-2">
                    <input type="text" id="chatInput" required placeholder="Andika swali au ujumbe..." class="flex-1 bg-slate-900 border border-slate-700 rounded-lg px-4 py-2 text-sm text-white">
                    <button type="submit" class="bg-cyan-600 hover:bg-cyan-500 text-white px-5 py-2 rounded-lg text-sm font-medium transition">
                        Tuma
                    </button>
                </form>
            </section>

        </main>
    </div>

    <!-- CORE JAVASCRIPT CONTROLLER -->
    <script>
        // Init Icons
        lucide.createIcons();
        let currentUser = null;

        // 1. App Startup Check (Kagua kama kuna Admin)
        async function initApp() {
            try {
                const { data: admins, error } = await _supabase.from('profiles').select('*').eq('role', 'admin');
                if (error) throw error;

                if (!admins || admins.length === 0) {
                    document.getElementById('adminSetupBox').classList.remove('hidden');
                } else {
                    document.getElementById('adminSetupBox').classList.add('hidden');
                }
            } catch (err) {
                console.error("Initialization Error:", err.message);
            }
        }

        // 2. Handle First Admin Setup
        async function handleAdminSetup(event) {
            event.preventDefault();
            const btn = document.getElementById('adminBtn');
            btn.innerText = "Inasajili...";
            btn.disabled = true;

            const name = document.getElementById('adminName').value.trim();
            const email = document.getElementById('adminEmail').value.trim();
            const pass = document.getElementById('adminPassword').value.trim();

            try {
                const { data, error } = await _supabase.from('profiles').insert([{
                    reg_no: 'TCC_ADMIN',
                    full_name: name,
                    email: email,
                    password: pass,
                    role: 'admin',
                    module_assigned: 'Lead Admin Architecture'
                }]).select();

                if (error) throw error;

                alert("🎉 Lead Admin amesajiliwa kikamilifu!\n\nIngia kwa:\nReg No / Email: " + email + "\nPassword: " + pass);
                document.getElementById('adminSetupBox').classList.add('hidden');
                document.getElementById('loginIdentifier').value = email;
                document.getElementById('loginPassword').value = pass;

            } catch (err) {
                alert("Usajili Umefeli: " + err.message);
            } finally {
                btn.innerText = "Tengeneza Lead Admin";
                btn.disabled = false;
            }
        }

        // 3. Handle User Login (Inazuia Data za Uongo)
        async function handleLogin(event) {
            event.preventDefault();
            const btn = document.getElementById('loginBtn');
            btn.innerText = "Inaingia...";
            btn.disabled = true;

            const id = document.getElementById('loginIdentifier').value.trim();
            const pass = document.getElementById('loginPassword').value.trim();

            try {
                const { data, error } = await _supabase.from('profiles')
                    .select('*')
                    .or(`reg_no.eq.${id},email.eq.${id}`)
                    .eq('password', pass);

                if (error) throw error;

                // Kama hakuna mtumiaji aliyepatikana (Taarifa za uongo)
                if (!data || data.length === 0) {
                    alert("❌ Taarifa si sahihi! Angalia Registration No/Email au Password yako.");
                    return;
                }

                currentUser = data[0];
                alert(`✅ Karibu tena, ${currentUser.full_name}!`);
                renderDashboard();

            } catch (err) {
                alert("Hitilafu wakati wa Login: " + err.message);
            } finally {
                btn.innerText = "Sign In";
                btn.disabled = false;
            }
        }

        // 4. Render Dashboard View
        function renderDashboard() {
            document.getElementById('authScreen').classList.add('hidden');
            document.getElementById('mainDashboard').classList.remove('hidden');

            document.getElementById('userNameDisplay').innerText = `${currentUser.full_name} (${currentUser.reg_no})`;
            document.getElementById('userBadgeRole').innerText = currentUser.role === 'admin' ? 'Lead Admin' : `Module: ${currentUser.module_assigned}`;

            if (currentUser.role === 'admin') {
                document.getElementById('adminPanel').classList.remove('hidden');
            }

            fetchSubmissions();
            fetchChats();
            subscribeRealtime();
        }

        // 5. Handle Member Registration (Admin Only)
        async function handleMemberRegistration(event) {
            event.preventDefault();
            const name = document.getElementById('newFullName').value.trim();
            const email = document.getElementById('newEmail').value.trim();
            const module = document.getElementById('newModule').value;
            const randomReg = 'TCC_PRG_' + Math.floor(1000 + Math.random() * 9000);

            try {
                const { error } = await _supabase.from('profiles').insert([{
                    reg_no: randomReg,
                    full_name: name,
                    email: email,
                    module_assigned: module,
                    password: '123456',
                    role: 'member'
                }]);

                if (error) throw error;

                alert(`🎉 Mjumbe Amesajiliwa Kikamilifu!\n\nID: ${randomReg}\nPassword: 123456`);
                event.target.reset();

            } catch (err) {
                alert("Usajili Umefeli: " + err.message);
            }
        }

        // 6. Handle Progress Submission & Media Upload
        async function handleWorkSubmission(event) {
            event.preventDefault();
            const btn = document.getElementById('submitWorkBtn');
            btn.innerText = "Inahifadhi...";
            btn.disabled = true;

            const pct = document.getElementById('subProgress').value;
            const notes = document.getElementById('subNotes').value;
            const mediaFile = document.getElementById('subMedia').files[0];
            let mediaUrl = null;

            try {
                if (mediaFile) {
                    const fileExt = mediaFile.name.split('.').pop();
                    const filePath = `${currentUser.reg_no}_${Date.now()}.${fileExt}`;
                    const { error: uploadErr } = await _supabase.storage.from('gsms-media').upload(filePath, mediaFile);

                    if (uploadErr) throw uploadErr;

                    const { data: urlData } = _supabase.storage.from('gsms-media').getPublicUrl(filePath);
                    mediaUrl = urlData.publicUrl;
                }

                const { error } = await _supabase.from('submissions').insert([{
                    reg_no: currentUser.reg_no,
                    full_name: currentUser.full_name,
                    module: currentUser.module_assigned || 'Core Developer',
                    progress_pct: pct,
                    notes: notes,
                    media_url: mediaUrl
                }]);

                if (error) throw error;

                event.target.reset();
                fetchSubmissions();

            } catch (err) {
                alert("Imeshindikana kupakia progress: " + err.message);
            } finally {
                btn.innerText = "Hifadhi Progress";
                btn.disabled = false;
            }
        }

        // 7. Fetch Submissions
        async function fetchSubmissions() {
            const { data, error } = await _supabase.from('submissions').select('*').order('created_at', { ascending: false });
            if (error) return;

            const list = document.getElementById('submissionsList');
            list.innerHTML = '';

            data?.forEach(sub => {
                const card = document.createElement('div');
                card.className = "bg-slate-900 border border-slate-700 p-4 rounded-xl space-y-3";
                let mediaElement = '';

                if (sub.media_url) {
                    if (sub.media_url.match(/\.(mp4|webm)$/i)) {
                        mediaElement = `<video src="${sub.media_url}" controls class="w-full h-40 object-cover rounded-lg mt-2"></video>`;
                    } else {
                        mediaElement = `<img src="${sub.media_url}" class="w-full h-40 object-cover rounded-lg mt-2" />`;
                    }
                }

                card.innerHTML = `
                    <div class="flex justify-between items-start">
                        <div>
                            <h4 class="font-bold text-white text-sm">${sub.full_name} <span class="text-xs font-normal text-slate-400">(${sub.reg_no})</span></h4>
                            <p class="text-xs text-blue-400">${sub.module}</p>
                        </div>
                        <span class="text-xs font-bold text-emerald-400 bg-emerald-950 px-2 py-1 rounded">${sub.progress_pct}%</span>
                    </div>
                    <p class="text-xs text-slate-300">${sub.notes}</p>
                    ${mediaElement}
                `;
                list.appendChild(card);
            });
        }

        // 8. Live Chat System
        async function handleSendChat(event) {
            event.preventDefault();
            const input = document.getElementById('chatInput');
            const msg = input.value.trim();
            if (!msg) return;

            try {
                await _supabase.from('messages').insert([{
                    sender_name: currentUse
